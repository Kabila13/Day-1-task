    <form>
        <label style="text-align: center;">
            <h2>Enquiry Form</h2>
        </label>
        <label for="name">Name</label>

        <label for="email">E-Mail</label>
        <input type="email" id="email"><br><br>
        <label for="message">Message</label>
        <textarea type="message"></textarea><br><br>
        <button type="submit">Submit</button>
        <dialog>
            <p>submitted successfully</p>
        </dialog>
    </form>
    <main>
        <section class="contact">

            <a href="tel:+916382038625"><img src="phone.png">+91 63820 38625</a><br><br>
            <img src="location.png"><b>Coimbatore</b>

    </main>

        <p class="footer" style="width: 100%;">&copy; 2026 creaviq technologies.All rights reserved</p>
